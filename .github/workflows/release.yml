name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build archives
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/Elliot-Wang/unix-config-sync/internal/app.Version=$VERSION" -o staging/unix-sync ./cmd/unix-sync
            tar -C staging -czf "dist/unix-sync_${os}_${arch}.tar.gz" unix-sync
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/Elliot-Wang/unix-config-sync/internal/app.Version=$VERSION" -o staging/unix-sync.exe ./cmd/unix-sync
            (cd staging && zip -q "../dist/unix-sync_windows_${arch}.zip" unix-sync.exe)
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
