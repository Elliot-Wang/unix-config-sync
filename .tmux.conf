# ----------------------------------------
# 1. 改变前缀键 (Prefix Key)
# ----------------------------------------

# 将默认前缀键 (Ctrl+b) 解绑 (unbind)
unbind C-b

# 设置新的前缀键为 Ctrl+k
set -g prefix C-k

# Prefix 按下后 2 秒内没有后续按键，自动取消 Prefix 状态
set -g prefix-timeout 2000

# 连续按两次 Ctrl+k，将 Ctrl+k 发送给当前应用
bind C-k send-prefix

# ----------------------------------------
# 2. 基础配置优化
# ----------------------------------------

# 窗口编号从 1 开始，而不是 0，这样按 1-9 更直观
set -g base-index 1
set -g pane-base-index 1

# 自动重命名窗口，让标题更具描述性
set -g automatic-rename on

# 启用鼠标支持 (非常推荐，可以直接点击切换窗格和窗口)
set -g mouse on

# 降低 Neovim 中 ESC 退出 Insert mode 的等待时间，同时保留 Alt 组合键判断窗口
set -sg escape-time 10

# 向 Neovim 传递 FocusGained / FocusLost 事件
set -g focus-events on

# 保留更多历史输出，关闭窗口后自动整理编号
set -g history-limit 100000
set -g renumber-windows on

# 当前 session 被销毁时，尝试切换到其他 session，而不是直接 detach
set -g detach-on-destroy off

# 使用外部clipboard，支持控制序列
set -g set-clipboard external
set -g allow-passthrough on

setw -g mode-keys vi
# ----------------------------------------
# 3. 更顺手的快捷键
# ----------------------------------------

# 快速重新加载配置 (当修改 ~/.tmux.conf 文件后，按 Ctrl+a, r 即可生效)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 分割窗格的快捷键使用更直观的按键:
# 原本: Ctrl+a, % (垂直) 和 Ctrl+a, " (水平)
# 现在: Ctrl+a, = (垂直) 和 Ctrl+a, - (水平)
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口时继承当前 pane 的工作目录
bind n new-window -c "#{pane_current_path}"

# ----------------------------------------
# 3.1 剪贴板管理优化
# ----------------------------------------
bind v copy-mode
bind p paste-buffer

# ----------------------------------------
# 3.2 复制模式优化
# ----------------------------------------
# 在复制模式中，使用 v 开始选择 (像 Vim 一样)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# 使用 y 复制选中的文本 (像 Vim 一样)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ----------------------------------------
# 4. 窗格切换优化
# ----------------------------------------

# 启用 Vim 风格的窗格切换（Prefix + h/j/k/l）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 注意：如果 Ctrl + 数字 被你的 Tabby 拦截了，
# 也可以考虑改用 Alt + 数字 (M-1, M-2...)，冲突概率更小

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Prefix 只需按一次，随后可在 repeat-time 内连续按 H/J/K/L 调整大小
set -g repeat-time 600
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind [ select-pane -t '{previous}'
bind ] select-pane -t '{next}'

# ----------------------------------------
# 5. 状态栏视觉优化 (支持 NerdFont)
# ----------------------------------------
# 告诉 Tmux 内部使用 256 色终端
set -g default-terminal "tmux-256color"

# 核心魔法：告诉 Tmux，不管外面包着的是什么终端（xterm/mosh），强行开启 24-bit RGB 真彩透传
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",*:RGB"

# 状态栏前景颜色
set -g status-fg "#abb2bf"

# 窗格边框颜色
set -g pane-border-style fg="#3e4452"
set -g pane-active-border-style fg="#61afef"

# ========================================
# 6. 插件管理 (TPM)
# ========================================

# 声明插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
# 移除网络插件，保留系统状态监控插件
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# --- sysstat 插件自定义配置 (监控 CPU 和 内存) ---
# CPU 展示模板：显示百分比
set -g @sysstat_cpu_view_tmpl 'CPU: #[fg=#{cpu.color}]#{cpu.pused}#[default]'
# 内存展示模板：显示百分比和已用容量
set -g @sysstat_mem_view_tmpl 'MEM: #[fg=#{mem.color}]#{mem.pused}#[default]'

# ========================================
# 7. 优化版状态栏 (CPU + Memory)
# ========================================

set -g status-interval 5
set -g status-justify left
set -g status-bg "#282c34"

# 左侧：显示会话名
set -g status-left-length 30
set -g status-left "#[bg=#61afef,fg=#282c34,bold]  #S #[bg=default,fg=#61afef] "

# 右侧：CPU 使用率 + 内存负载 + 时间
set -g status-right-length 150
# 这里去掉了网络展示，加入了 CPU () 模块
set -g status-right "#[fg=#3e4452]#[bg=#3e4452,fg=#abb2bf]  #{sysstat_cpu} #[fg=#98c379]#[bg=#98c379,fg=#282c34,bold]  #{sysstat_mem} #[fg=#e5c07b]#[bg=#e5c07b,fg=#282c34,bold]  %H:%M "

# 窗口标签样式 (保持不变)
setw -g window-status-format "#[fg=#5c6370] #I:#W "
setw -g window-status-current-format "#[fg=#c678dd]#[bg=#c678dd,fg=#ffffff,bold]#I:#W#[bg=default,fg=#c678dd]"

# 初始化 TPM
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
